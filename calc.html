<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolatrice</title>
</head>
<body>

    <h2>Calcolatrice</h2>
    <input type="text" id="num1" placeholder="Primo numero">
    <br>
    <button onclick="calcola('+')">+</button>
    <button onclick="calcola('-')">-</button>
    <button onclick="calcola('*')">*</button>
    <button onclick="calcola('/')">/</button>
    <br>
    <input type="text" id="num2" placeholder="Secondo numero">
    <br>
    <br>
    <input type="text" id="risultato" placeholder="Risultato" readonly>
    <div id="risultato" style="margin-top: 15px; font-weight: bold;"></div>


    <script>
        function calcola(operatore) {
            let n1 = +document.getElementById("num1").value;
            let n2 = +document.getElementById("num2").value;
            let totale = 0;

            switch (operatore) {
                case "+":
                    totale = n1 + n2;
                    break;
                case "-":
                    totale = n1 - n2;
                    break;
                case "*":
                    totale = n1 * n2;
                    break;
                case "/":
                    totale = n1 / n2;
                    break;
            }

            document.getElementById("risultato").value = totale;
        }
    </script>

</body>
</html>
